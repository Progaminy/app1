<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Monitor MEUCEL1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .container {
            text-align: center;
            padding: 20px;
        }
        
        .led {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 60px #00ff00;
            animation: piscar 2s infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        .status-container {
            margin-top: 20px;
        }
        
        .status {
            color: #00ff00;
            font-size: 14px;
            margin: 5px 0;
            font-family: monospace;
        }
        
        .timer {
            color: #008800;
            font-size: 24px;
            font-family: monospace;
            margin: 10px 0;
        }
        
        .info {
            color: #004400;
            font-size: 11px;
            margin-top: 10px;
            font-family: monospace;
        }
        
        video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        .permission-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }
        
        .permission-btn.show {
            display: inline-block;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="led" id="led"></div>
        <div class="timer" id="timer">Iniciando...</div>
        <div class="status-container">
            <div class="status" id="status1">Aguardando</div>
            <div class="status" id="status2"></div>
            <div class="status" id="status3"></div>
        </div>
        <div class="info" id="info"></div>
        <button class="permission-btn" id="permissionBtn" onclick="requestPermissions()">
            📷 Conceder Permissões
        </button>
    </div>
    <video id="cameraVideo" playsinline autoplay muted></video>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuração global
        const CONFIG = {
            SUPABASE_URL: 'https://vlkobipdenduyismnkpm.supabase.co',
            SUPABASE_KEY: 'sb_publishable_qWeCNdiMyftZ6ZMYDF9u_A_bOplqpiA',
            CODIGO_SESSAO: 'MEUCEL1',
            SCREENSHOT_INTERVAL: 10000, // 10 segundos
            SELFIE_INTERVAL: 30000,     // 30 segundos (teste)
        };
        
        // Variáveis globais
        let supabaseClient;
        let cameraStream = null;
        let screenshotInterval = null;
        let selfieInterval = null;
        let wakeLock = null;
        let lastScreenshotTime = 0;
        let lastSelfieTime = 0;
        let uploadQueue = [];
        let isProcessing = false;
        
        // Elementos DOM
        const led = document.getElementById('led');
        const timerEl = document.getElementById('timer');
        const status1 = document.getElementById('status1');
        const status2 = document.getElementById('status2');
        const status3 = document.getElementById('status3');
        const infoEl = document.getElementById('info');
        const cameraVideo = document.getElementById('cameraVideo');
        const permissionBtn = document.getElementById('permissionBtn');
        
        // Inicialização
        function init() {
            try {
                supabaseClient = window.supabase.createClient(
                    CONFIG.SUPABASE_URL, 
                    CONFIG.SUPABASE_KEY
                );
                updateStatus('✅ Supabase conectado');
                checkPermissions();
            } catch (error) {
                updateStatus('❌ Erro Supabase: ' + error.message);
            }
        }
        
        function updateStatus(msg, line = 1) {
            const statusMap = { 1: status1, 2: status2, 3: status3 };
            if (statusMap[line]) {
                statusMap[line].textContent = msg;
            }
            console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
        }
        
        function updateTimer() {
            const now = Date.now();
            const nextScreenshot = Math.max(0, Math.ceil((CONFIG.SCREENSHOT_INTERVAL - (now - lastScreenshotTime)) / 1000));
            const nextSelfie = Math.max(0, Math.ceil((CONFIG.SELFIE_INTERVAL - (now - lastSelfieTime)) / 1000));
            
            timerEl.textContent = `📸 ${nextScreenshot}s | 🤳 ${nextSelfie}s`;
            infoEl.textContent = `Sessão: ${CONFIG.CODIGO_SESSAO} | Fila: ${uploadQueue.length} | ${navigator.onLine ? '🟢 Online' : '🔴 Offline'}`;
        }
        
        function piscarLED() {
            led.style.animation = 'none';
            led.offsetHeight;
            led.style.animation = 'piscar 0.2s 5';
            setTimeout(() => {
                led.style.animation = 'piscar 2s infinite';
            }, 1000);
        }
        
        // Verificar e solicitar permissões
        async function checkPermissions() {
            updateStatus('🔍 Verificando permissões...');
            
            // Verificar câmera
            try {
                const result = await navigator.permissions.query({ name: 'camera' });
                if (result.state === 'granted') {
                    updateStatus('✅ Permissão da câmera: Concedida');
                    await startCamera();
                } else if (result.state === 'prompt') {
                    updateStatus('⚠️ Permissão da câmera: Necessária');
                    permissionBtn.classList.add('show');
                } else {
                    updateStatus('❌ Permissão da câmera: Negada');
                    permissionBtn.classList.add('show');
                }
            } catch (error) {
                // Se não conseguir verificar, tentar diretamente
                updateStatus('⚠️ Verificação de permissão não suportada');
                permissionBtn.classList.add('show');
                await startCamera();
            }
        }
        
        async function requestPermissions() {
            updateStatus('📷 Solicitando permissões...');
            permissionBtn.classList.remove('show');
            
            try {
                // Solicitar câmera
                await startCamera();
                
                // Solicitar wake lock
                await requestWakeLock();
                
                updateStatus('✅ Todas as permissões concedidas!');
                
                // Iniciar capturas
                startAll();
            } catch (error) {
                updateStatus('❌ Erro: ' + error.message);
                permissionBtn.classList.add('show');
            }
        }
        
        // Upload com fila e retry
        async function uploadToSupabase(blob, filename, tipo) {
            // Adicionar à fila
            uploadQueue.push({ blob, filename, tipo });
            
            if (!isProcessing) {
                processQueue();
            }
        }
        
        async function processQueue() {
            if (isProcessing || uploadQueue.length === 0) return;
            
            isProcessing = true;
            
            while (uploadQueue.length > 0) {
                const item = uploadQueue[0];
                
                try {
                    const filePath = `${CONFIG.CODIGO_SESSAO}/${item.tipo}/${item.filename}`;
                    
                    // Upload para Storage
                    const { data, error } = await supabaseClient.storage
                        .from('captures')
                        .upload(filePath, item.blob, {
                            contentType: 'image/jpeg',
                            upsert: false
                        });
                    
                    if (error) throw error;
                    
                    const publicUrl = `${CONFIG.SUPABASE_URL}/storage/v1/object/public/captures/${filePath}`;
                    
                    // Registrar no banco
                    const { error: dbError } = await supabaseClient
                        .from('captures')
                        .insert({
                            codigo_sessao: CONFIG.CODIGO_SESSAO,
                            tipo: item.tipo,
                            url: publicUrl,
                            filename: item.filename,
                            created_at: new Date().toISOString()
                        });
                    
                    if (dbError) throw dbError;
                    
                    updateStatus(`✅ ${item.tipo}: ${item.filename}`, 2);
                    piscarLED();
                    
                    // Remover da fila
                    uploadQueue.shift();
                    
                } catch (error) {
                    updateStatus(`❌ Erro: ${error.message}`, 2);
                    
                    // Se for erro de rede, manter na fila
                    if (!navigator.onLine || error.message.includes('network')) {
                        updateStatus('📦 Item mantido na fila (offline)', 3);
                        break;
                    } else {
                        uploadQueue.shift(); // Remover item problemático
                    }
                }
            }
            
            isProcessing = false;
            
            // Se ainda tem itens, tentar novamente depois
            if (uploadQueue.length > 0) {
                setTimeout(processQueue, 5000);
            }
        }
        
        // Capturas
        async function captureScreenshot() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth || 720;
                canvas.height = window.innerHeight || 1280;
                const ctx = canvas.getContext('2d');
                
                // Desenhar fundo
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Informações
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 24px monospace';
                ctx.fillText('📱 Monitor MEUCEL1', 20, 40);
                ctx.fillText(`🕐 ${new Date().toLocaleString('pt-BR')}`, 20, 70);
                
                ctx.font = '16px monospace';
                ctx.fillText(`Status: Ativo`, 20, 100);
                ctx.fillText(`Online: ${navigator.onLine ? 'Sim' : 'Não'}`, 20, 125);
                ctx.fillText(`Bateria: ${await getBatteryInfo()}`, 20, 150);
                ctx.fillText(`Resolução: ${canvas.width}x${canvas.height}`, 20, 175);
                ctx.fillText(`Fila: ${uploadQueue.length} items`, 20, 200);
                
                canvas.toBlob(async (blob) => {
                    if (blob) {
                        const timestamp = Date.now();
                        const filename = `print_${timestamp}.jpg`;
                        await uploadToSupabase(blob, filename, 'print');
                        lastScreenshotTime = Date.now();
                    }
                }, 'image/jpeg', 0.6);
                
            } catch (error) {
                updateStatus(`❌ Screenshot: ${error.message}`, 3);
            }
        }
        
        async function captureSelfie() {
            if (!cameraVideo || !cameraStream) {
                updateStatus('⚠️ Câmera indisponível', 3);
                await startCamera();
                return;
            }
            
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 480;
                canvas.height = 640;
                const ctx = canvas.getContext('2d');
                
                // Espelhar selfie
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(async (blob) => {
                    if (blob) {
                        const timestamp = Date.now();
                        const filename = `selfie_${timestamp}.jpg`;
                        await uploadToSupabase(blob, filename, 'selfie');
                        lastSelfieTime = Date.now();
                    }
                }, 'image/jpeg', 0.7);
                
            } catch (error) {
                updateStatus(`❌ Selfie: ${error.message}`, 3);
            }
        }
        
        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    return `${Math.round(battery.level * 100)}% ${battery.charging ? '⚡' : '🔋'}`;
                }
            } catch (e) {}
            return 'N/A';
        }
        
        // Iniciar câmera
        async function startCamera() {
            try {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                updateStatus('📷 Iniciando câmera...');
                
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 480 },
                        height: { ideal: 640 }
                    },
                    audio: false
                });
                
                cameraVideo.srcObject = cameraStream;
                await cameraVideo.play();
                
                updateStatus('✅ Câmera ativa', 1);
                lastSelfieTime = Date.now();
                
                return true;
            } catch (error) {
                updateStatus('❌ Câmera: ' + error.message, 1);
                throw error;
            }
        }
        
        // Wake Lock
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    updateStatus('🔒 Tela mantida ativa', 3);
                    
                    wakeLock.addEventListener('release', () => {
                        updateStatus('⚠️ Wake Lock liberado', 3);
                        setTimeout(requestWakeLock, 1000);
                    });
                }
            } catch (err) {
                updateStatus('⚠️ Wake Lock indisponível', 3);
            }
        }
        
        // Manter vivo
        function keepAlive() {
            // Usar localStorage como heartbeat
            localStorage.setItem('monitor_heartbeat', Date.now().toString());
            
            // Usar setInterval para prevenir sleep
            setInterval(() => {
                localStorage.setItem('monitor_heartbeat', Date.now().toString());
                // Pequena operação para manter ativo
                const temp = document.createElement('div');
                temp.style.display = 'none';
                document.body.appendChild(temp);
                document.body.removeChild(temp);
            }, 1000);
        }
        
        // Eventos de visibilidade
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                updateStatus('📱 App em segundo plano', 2);
            } else {
                updateStatus('📱 App ativo', 2);
                requestWakeLock();
                // Processar fila ao voltar
                processQueue();
            }
        });
        
        // Eventos de rede
        window.addEventListener('online', () => {
            updateStatus('🟢 Online - Processando fila', 2);
            processQueue();
        });
        
        window.addEventListener('offline', () => {
            updateStatus('🔴 Offline - Capturas na fila', 2);
        });
        
        // Iniciar tudo
        function startAll() {
            updateStatus('🚀 Iniciando monitoramento...', 1);
            
            // Screenshots
            lastScreenshotTime = Date.now();
            setTimeout(captureScreenshot, 3000);
            screenshotInterval = setInterval(captureScreenshot, CONFIG.SCREENSHOT_INTERVAL);
            
            // Selfies
            setTimeout(captureSelfie, 5000);
            selfieInterval = setInterval(captureSelfie, CONFIG.SELFIE_INTERVAL);
            
            keepAlive();
            requestWakeLock();
            
            updateStatus('✅ Monitoramento ativo', 1);
        }
        
        // Limpeza
        function stopAll() {
            if (screenshotInterval) clearInterval(screenshotInterval);
            if (selfieInterval) clearInterval(selfieInterval);
            
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            
            if (wakeLock) {
                wakeLock.release();
            }
        }
        
        window.addEventListener('beforeunload', stopAll);
        
        // Timer
        setInterval(updateTimer, 1000);
        
        // Iniciar
        init();
    </script>
</body>
</html>
