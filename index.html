<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Monitor MEUCEL1</title>
    
    <!-- HTML2CANVAS para captura real da tela -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Água-marca invisível na tela toda */
        .watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #00ff00;
            font-family: monospace;
            text-align: center;
            writing-mode: vertical-lr;
            letter-spacing: 20px;
            transform: rotate(-45deg);
        }
        
        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }
        
        .led {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 60px #00ff00;
            animation: piscar 2s infinite;
            margin: 0 auto 20px;
        }
        
        .led.parado {
            animation: none;
            background: #333;
            box-shadow: none;
        }
        
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        .status {
            color: #00ff00;
            font-size: 13px;
            margin: 5px 0;
            font-family: monospace;
            padding: 8px;
            background: #0a0a0a;
            border-radius: 8px;
            word-break: break-word;
        }
        
        .timer {
            color: #008800;
            font-size: 18px;
            font-family: monospace;
            margin: 10px 0;
        }
        
        .info {
            color: #004400;
            font-size: 10px;
            margin-top: 10px;
            font-family: monospace;
        }
        
        video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        button {
            width: 100%;
            padding: 18px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: all 0.2s;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .btn-iniciar {
            background: #00ff00;
            color: #000;
            font-size: 22px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(0,255,0,0.5);
            animation: pulse-btn 2s infinite;
        }
        
        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 0 20px rgba(0,255,0,0.3); }
            50% { box-shadow: 0 0 40px rgba(0,255,0,0.6), 0 0 80px rgba(0,255,0,0.3); }
        }
        
        .btn-parar {
            background: #ff0000;
            color: #fff;
            font-size: 18px;
        }
        
        .btn-camera {
            background: #ffaa00;
            color: #000;
            font-size: 14px;
        }
        
        .alerta-camera {
            background: #1a1000;
            border: 1px solid #ffaa00;
            color: #ffcc00;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 12px;
            text-align: center;
        }
        
        .status-camera {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .camera-ok { background: #003300; color: #00ff00; }
        .camera-falta { background: #331100; color: #ffaa00; }
        .camera-off { background: #111; color: #666; }
        
        .badge-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .status-ativo {
            background: #003300;
            color: #00ff00;
            border: 2px solid #00ff00;
            animation: pulse-border 2s infinite;
        }
        
        .status-parado {
            background: #330000;
            color: #ff0000;
            border: 2px solid #ff0000;
        }
        
        @keyframes pulse-border {
            0%, 100% { border-color: #00ff00; }
            50% { border-color: #00cc00; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        }
        
        .versao {
            position: fixed;
            bottom: 5px;
            right: 10px;
            color: #002200;
            font-size: 8px;
            font-family: monospace;
            z-index: 9999;
        }
        
        .debug-info {
            position: fixed;
            top: 5px;
            left: 5px;
            color: #003300;
            font-size: 8px;
            font-family: monospace;
            z-index: 9999;
            text-align: left;
        }
    </style>
</head>
<body>
    <!-- Marca d'água para aparecer nos prints -->
    <div class="watermark">MEUCEL1 MONITOR</div>
    
    <!-- Info debug -->
    <div class="debug-info" id="debugInfo"></div>
    
    <div class="container" id="container">
        <div class="led parado" id="led"></div>
        
        <div class="badge-status status-parado" id="badgeStatus">
            ⏸️ PARADO
        </div>
        
        <div class="timer" id="timer">Aguardando...</div>
        
        <div class="status" id="status1">
            Pressione INICIAR para começar
        </div>
        
        <div id="statusCamera" style="margin: 8px 0;">
            <span class="status-camera camera-off" id="badgeCamera">
                📷 Câmera: Aguardando
            </span>
        </div>
        
        <button class="btn-iniciar" id="btnIniciar">
            ▶️ INICIAR MONITORAMENTO
        </button>
        
        <button class="btn-parar" id="btnParar" style="display:none;">
            ⏹️ PARAR MONITORAMENTO
        </button>
        
        <div id="alertaCamera" style="display:none;">
            <div class="alerta-camera">
                ⚠️ <strong>Câmera não configurada</strong><br>
                <small>Selfies não serão tiradas</small>
            </div>
            <button class="btn-camera" id="btnPermissao">
                📷 CONCEDER PERMISSÃO DA CÂMERA
            </button>
        </div>
        
        <div class="status" id="status2" style="display:none;"></div>
        <div class="info" id="info"></div>
    </div>
    
    <video id="cameraVideo" playsinline autoplay muted></video>
    <div class="versao">v3.0 • Monitor MEUCEL1</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const CONFIG = {
                SUPABASE_URL: 'https://vlkobipdenduyismnkpm.supabase.co',
                SUPABASE_KEY: 'sb_publishable_qWeCNdiMyftZ6ZMYDF9u_A_bOplqpiA',
                CODIGO_SESSAO: 'MEUCEL1',
                SCREENSHOT_INTERVAL: 10000,
                SELFIE_INTERVAL: 30000,
                LEMBRETE_CAMERA: 180000,
            };
            
            let supabaseClient;
            let cameraStream = null;
            let screenshotInterval = null;
            let selfieInterval = null;
            let lembreteInterval = null;
            let wakeLock = null;
            let lastScreenshotTime = Date.now();
            let lastSelfieTime = Date.now();
            let uploadQueue = [];
            let isProcessing = false;
            let monitoramentoAtivo = false;
            let cameraDisponivel = false;
            let screenshotCount = 0;
            let selfieCount = 0;
            
            const led = document.getElementById('led');
            const timerEl = document.getElementById('timer');
            const status1 = document.getElementById('status1');
            const status2 = document.getElementById('status2');
            const infoEl = document.getElementById('info');
            const debugInfo = document.getElementById('debugInfo');
            const cameraVideo = document.getElementById('cameraVideo');
            const btnIniciar = document.getElementById('btnIniciar');
            const btnParar = document.getElementById('btnParar');
            const btnPermissao = document.getElementById('btnPermissao');
            const alertaCamera = document.getElementById('alertaCamera');
            const badgeCamera = document.getElementById('badgeCamera');
            const badgeStatus = document.getElementById('badgeStatus');
            
            function init() {
                try {
                    supabaseClient = window.supabase.createClient(
                        CONFIG.SUPABASE_URL, 
                        CONFIG.SUPABASE_KEY
                    );
                    status1.textContent = '✅ Supabase conectado';
                } catch (error) {
                    status1.textContent = '❌ Erro: ' + error.message;
                }
                
                setInterval(updateTimer, 1000);
                atualizarUI();
                atualizarDebug();
            }
            
            function atualizarDebug() {
                setInterval(() => {
                    debugInfo.innerHTML = `
                        📸 Prints: ${screenshotCount}<br>
                        🤳 Selfies: ${selfieCount}<br>
                        📦 Fila: ${uploadQueue.length}<br>
                        🌐 ${navigator.onLine ? 'On' : 'Off'}
                    `;
                }, 2000);
            }
            
            btnIniciar.addEventListener('click', iniciarMonitoramento);
            btnParar.addEventListener('click', pararMonitoramento);
            
            btnPermissao.addEventListener('click', async () => {
                btnPermissao.textContent = '⏳ Solicitando...';
                btnPermissao.disabled = true;
                
                try {
                    await startCamera();
                    cameraDisponivel = true;
                    atualizarStatusCamera(true);
                    
                    if (monitoramentoAtivo) iniciarSelfies();
                    
                    alertaCamera.style.display = 'none';
                    status1.textContent = '✅ Câmera ativada!';
                    piscarLED();
                } catch (error) {
                    status1.textContent = '❌ Permissão negada';
                    btnPermissao.textContent = '📷 TENTAR NOVAMENTE';
                    btnPermissao.disabled = false;
                }
            });
            
            function iniciarMonitoramento() {
                if (monitoramentoAtivo) return;
                
                monitoramentoAtivo = true;
                screenshotCount = 0;
                selfieCount = 0;
                
                btnIniciar.style.display = 'none';
                btnParar.style.display = 'block';
                badgeStatus.textContent = '🟢 ATIVO';
                badgeStatus.className = 'badge-status status-ativo';
                led.classList.remove('parado');
                
                iniciarScreenshots();
                tentarCamera();
                iniciarLembreteCamera();
                requestWakeLock();
                
                status1.textContent = '🚀 Monitoramento INICIADO';
                piscarLED();
            }
            
            function pararMonitoramento() {
                monitoramentoAtivo = false;
                
                if (screenshotInterval) clearInterval(screenshotInterval);
                if (selfieInterval) clearInterval(selfieInterval);
                if (lembreteInterval) clearInterval(lembreteInterval);
                
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    cameraStream = null;
                }
                
                if (wakeLock) {
                    wakeLock.release();
                    wakeLock = null;
                }
                
                btnIniciar.style.display = 'block';
                btnParar.style.display = 'none';
                badgeStatus.textContent = '⏸️ PARADO';
                badgeStatus.className = 'badge-status status-parado';
                led.classList.add('parado');
                
                cameraDisponivel = false;
                atualizarStatusCamera(false);
                alertaCamera.style.display = 'none';
                status2.style.display = 'none';
                
                timerEl.textContent = 'Aguardando...';
                status1.textContent = `Finalizado • ${screenshotCount} prints | ${selfieCount} selfies`;
            }
            
            // ==========================================
            // CAPTURA REAL DA TELA COM HTML2CANVAS
            // ==========================================
            function iniciarScreenshots() {
                lastScreenshotTime = Date.now();
                
                setTimeout(() => {
                    if (monitoramentoAtivo) captureScreenReal();
                }, 3000);
                
                screenshotInterval = setInterval(() => {
                    if (monitoramentoAtivo) captureScreenReal();
                }, CONFIG.SCREENSHOT_INTERVAL);
            }
            
            async function captureScreenReal() {
                try {
                    status1.textContent = '📸 Capturando tela...';
                    
                    // Usar html2canvas para capturar o body inteiro
                    const canvas = await html2canvas(document.body, {
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: '#000',
                        scale: 0.8, // Reduzir tamanho do arquivo
                        logging: false
                    });
                    
                    // Adicionar informações no canvas
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#00ff00';
                    ctx.font = 'bold 30px monospace';
                    ctx.fillText('📱 Monitor MEUCEL1', 20, 50);
                    ctx.fillText(new Date().toLocaleString('pt-BR'), 20, 85);
                    ctx.fillText(`Print #${screenshotCount + 1}`, 20, 120);
                    
                    // Converter para blob e upload
                    canvas.toBlob(async (blob) => {
                        if (blob && monitoramentoAtivo) {
                            await uploadToSupabase(blob, `print_${Date.now()}.jpg`, 'print');
                            lastScreenshotTime = Date.now();
                            screenshotCount++;
                            status1.textContent = `📸 Print #${screenshotCount} capturado`;
                            piscarLED();
                        }
                    }, 'image/jpeg', 0.7);
                    
                } catch (error) {
                    console.error('Erro captura:', error);
                    status1.textContent = '❌ Erro no print: ' + error.message;
                    
                    // Fallback: canvas simples
                    captureFallback();
                }
            }
            
            // Fallback se html2canvas falhar
            function captureFallback() {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth || 720;
                canvas.height = window.innerHeight || 1280;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 24px monospace';
                ctx.fillText('📱 Monitor MEUCEL1', 20, 40);
                ctx.fillText(new Date().toLocaleString('pt-BR'), 20, 70);
                ctx.fillText('Tela: ' + canvas.width + 'x' + canvas.height, 20, 100);
                
                canvas.toBlob(async (blob) => {
                    if (blob && monitoramentoAtivo) {
                        await uploadToSupabase(blob, `print_${Date.now()}.jpg`, 'print');
                        lastScreenshotTime = Date.now();
                        screenshotCount++;
                    }
                }, 'image/jpeg', 0.6);
            }
            
            // ==========================================
            // CÂMERA
            // ==========================================
            async function tentarCamera() {
                try {
                    await startCamera();
                    cameraDisponivel = true;
                    atualizarStatusCamera(true);
                    iniciarSelfies();
                    alertaCamera.style.display = 'none';
                } catch (error) {
                    cameraDisponivel = false;
                    atualizarStatusCamera(false);
                    if (monitoramentoAtivo) {
                        alertaCamera.style.display = 'block';
                        status2.style.display = 'block';
                        status2.textContent = '⚠️ Selfies desativadas';
                    }
                }
            }
            
            async function startCamera() {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 480 },
                        height: { ideal: 640 }
                    },
                    audio: false
                });
                
                cameraVideo.srcObject = cameraStream;
                await cameraVideo.play();
                return true;
            }
            
            function iniciarSelfies() {
                if (selfieInterval) clearInterval(selfieInterval);
                lastSelfieTime = Date.now();
                
                setTimeout(() => {
                    if (monitoramentoAtivo && cameraDisponivel) captureSelfie();
                }, 5000);
                
                selfieInterval = setInterval(() => {
                    if (monitoramentoAtivo && cameraDisponivel) captureSelfie();
                }, CONFIG.SELFIE_INTERVAL);
            }
            
            async function captureSelfie() {
                if (!cameraVideo || !cameraStream) return;
                
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 480;
                    canvas.height = 640;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob && monitoramentoAtivo) {
                            await uploadToSupabase(blob, `selfie_${Date.now()}.jpg`, 'selfie');
                            lastSelfieTime = Date.now();
                            selfieCount++;
                            status1.textContent = `🤳 Selfie #${selfieCount} capturada`;
                            piscarLED();
                        }
                    }, 'image/jpeg', 0.7);
                    
                } catch (error) {
                    console.error('Erro selfie:', error);
                }
            }
            
            function iniciarLembreteCamera() {
                if (lembreteInterval) clearInterval(lembreteInterval);
                
                lembreteInterval = setInterval(() => {
                    if (monitoramentoAtivo && !cameraDisponivel) {
                        tentarCamera();
                        if (!cameraDisponivel) {
                            alertaCamera.style.display = 'block';
                        }
                    }
                }, CONFIG.LEMBRETE_CAMERA);
            }
            
            function atualizarStatusCamera(disponivel) {
                if (disponivel) {
                    badgeCamera.textContent = '📷 Câmera: Ativa';
                    badgeCamera.className = 'status-camera camera-ok';
                } else if (monitoramentoAtivo) {
                    badgeCamera.textContent = '📷 Câmera: Não configurada';
                    badgeCamera.className = 'status-camera camera-falta';
                } else {
                    badgeCamera.textContent = '📷 Câmera: Aguardando';
                    badgeCamera.className = 'status-camera camera-off';
                }
            }
            
            function atualizarUI() {
                if (monitoramentoAtivo) {
                    btnIniciar.style.display = 'none';
                    btnParar.style.display = 'block';
                } else {
                    btnIniciar.style.display = 'block';
                    btnParar.style.display = 'none';
                }
            }
            
            function updateTimer() {
                if (!monitoramentoAtivo) {
                    timerEl.textContent = 'Aguardando...';
                    return;
                }
                
                const now = Date.now();
                const nextScreenshot = Math.max(0, Math.ceil((CONFIG.SCREENSHOT_INTERVAL - (now - lastScreenshotTime)) / 1000));
                const nextSelfie = cameraDisponivel ? 
                    Math.max(0, Math.ceil((CONFIG.SELFIE_INTERVAL - (now - lastSelfieTime)) / 1000)) : 
                    '--';
                
                timerEl.textContent = `📸 ${nextScreenshot}s | 🤳 ${nextSelfie}s`;
                infoEl.textContent = `Prints: ${screenshotCount} | Selfies: ${selfieCount} | Sessão: ${CONFIG.CODIGO_SESSAO}`;
            }
            
            function piscarLED() {
                if (!monitoramentoAtivo) return;
                led.style.animation = 'none';
                led.offsetHeight;
                led.style.animation = 'piscar 0.2s 5';
                setTimeout(() => {
                    if (monitoramentoAtivo) {
                        led.style.animation = 'piscar 2s infinite';
                    }
                }, 1000);
            }
            
            async function uploadToSupabase(blob, filename, tipo) {
                uploadQueue.push({ blob, filename, tipo });
                if (!isProcessing) processQueue();
            }
            
            async function processQueue() {
                if (isProcessing || uploadQueue.length === 0) return;
                
                isProcessing = true;
                
                while (uploadQueue.length > 0) {
                    const item = uploadQueue[0];
                    
                    try {
                        const filePath = `${CONFIG.CODIGO_SESSAO}/${item.tipo}/${item.filename}`;
                        
                        const { error } = await supabaseClient.storage
                            .from('captures')
                            .upload(filePath, item.blob, {
                                contentType: 'image/jpeg',
                                upsert: false
                            });
                        
                        if (error) throw error;
                        
                        const publicUrl = `${CONFIG.SUPABASE_URL}/storage/v1/object/public/captures/${filePath}`;
                        
                        await supabaseClient.from('captures').insert({
                            codigo_sessao: CONFIG.CODIGO_SESSAO,
                            tipo: item.tipo,
                            url: publicUrl,
                            filename: item.filename,
                            created_at: new Date().toISOString()
                        });
                        
                        uploadQueue.shift();
                        
                    } catch (error) {
                        if (!navigator.onLine) break;
                        uploadQueue.shift();
                    }
                }
                
                isProcessing = false;
                
                if (uploadQueue.length > 0) {
                    setTimeout(processQueue, 5000);
                }
            }
            
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => {
                            if (monitoramentoAtivo) {
                                setTimeout(requestWakeLock, 1000);
                            }
                        });
                    }
                } catch (err) {}
            }
            
            window.addEventListener('online', () => {
                processQueue();
                if (monitoramentoAtivo) status1.textContent = '🟢 Online';
            });
            
            window.addEventListener('offline', () => {
                if (monitoramentoAtivo) status1.textContent = '🔴 Offline';
            });
            
            init();
        })();
    </script>
</body>
</html>
