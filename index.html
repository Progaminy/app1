<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Monitor MEUCEL1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }
        
        .led {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 60px #00ff00;
            animation: piscar 2s infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        .status {
            color: #00ff00;
            font-size: 13px;
            margin: 8px 0;
            font-family: monospace;
            padding: 8px;
            background: #0a0a0a;
            border-radius: 8px;
            word-break: break-word;
        }
        
        .timer {
            color: #008800;
            font-size: 18px;
            font-family: monospace;
            margin: 10px 0;
        }
        
        .info {
            color: #004400;
            font-size: 10px;
            margin-top: 10px;
            font-family: monospace;
        }
        
        video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        button {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        button:active {
            transform: scale(0.96);
        }
        
        .btn-camera {
            background: #00ff00;
            color: #000;
        }
        
        .btn-config {
            background: #ffaa00;
            color: #000;
        }
        
        .btn-iniciar {
            background: #0088ff;
            color: #fff;
            font-size: 18px;
            padding: 20px;
        }
        
        .alerta {
            background: #1a0000;
            border: 1px solid #ff0000;
            color: #ff4444;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 12px;
            text-align: left;
            line-height: 1.5;
        }
        
        .alerta strong {
            color: #ff6666;
        }
        
        .ajuda-box {
            background: #1a1a00;
            border: 1px solid #ffaa00;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: left;
            color: #ffcc00;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .ajuda-box strong {
            color: #ffaa00;
        }
        
        .btn-entendi {
            background: #ffaa00;
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="led" id="led"></div>
        <div class="timer" id="timer">Iniciando...</div>
        
        <div class="status" id="status1">Verificando permissões...</div>
        <div class="status" id="status2" style="display:none;"></div>
        
        <div class="alerta" id="alertaPermissao" style="display:none;">
            <strong>⚠️ PERMISSÃO DA CÂMERA NEGADA</strong><br>
            O app precisa acessar a câmera para tirar selfies.
        </div>
        
        <button class="btn-camera" id="btnPermissao" style="display:none;">
            📷 TENTAR CONCEDER PERMISSÃO
        </button>
        
        <button class="btn-config" id="btnConfig" style="display:none;">
            ⚙️ COMO CONCEDER PERMISSÃO
        </button>
        
        <button class="btn-iniciar" id="btnIniciar" style="display:none;">
            ▶️ INICIAR MONITORAMENTO
        </button>
        
        <div class="info" id="info"></div>
    </div>
    <video id="cameraVideo" playsinline autoplay muted></video>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const CONFIG = {
                SUPABASE_URL: 'https://vlkobipdenduyismnkpm.supabase.co',
                SUPABASE_KEY: 'sb_publishable_qWeCNdiMyftZ6ZMYDF9u_A_bOplqpiA',
                CODIGO_SESSAO: 'MEUCEL1',
                SCREENSHOT_INTERVAL: 10000,
                SELFIE_INTERVAL: 30000,
            };
            
            let supabaseClient;
            let cameraStream = null;
            let screenshotInterval = null;
            let selfieInterval = null;
            let wakeLock = null;
            let lastScreenshotTime = 0;
            let lastSelfieTime = 0;
            let uploadQueue = [];
            let isProcessing = false;
            let monitoramentoAtivo = false;
            
            const led = document.getElementById('led');
            const timerEl = document.getElementById('timer');
            const status1 = document.getElementById('status1');
            const status2 = document.getElementById('status2');
            const infoEl = document.getElementById('info');
            const cameraVideo = document.getElementById('cameraVideo');
            const btnPermissao = document.getElementById('btnPermissao');
            const btnConfig = document.getElementById('btnConfig');
            const btnIniciar = document.getElementById('btnIniciar');
            const alertaPermissao = document.getElementById('alertaPermissao');
            const container = document.getElementById('container');
            
            // Botão: Tentar permissão
            btnPermissao.addEventListener('click', async () => {
                status1.textContent = '📷 Solicitando permissão...';
                btnPermissao.style.display = 'none';
                
                try {
                    await startCamera();
                    mostrarSucesso();
                } catch (error) {
                    if (error.name === 'NotAllowedError') {
                        status1.textContent = '❌ Permissão negada';
                        status2.style.display = 'block';
                        status2.textContent = 'Use o botão "COMO CONCEDER PERMISSÃO"';
                        btnPermissao.style.display = 'block';
                        btnConfig.style.display = 'block';
                        alertaPermissao.style.display = 'block';
                    } else {
                        status1.textContent = 'Erro: ' + error.message;
                        btnPermissao.style.display = 'block';
                    }
                }
            });
            
            // Botão: Mostrar instruções
            btnConfig.addEventListener('click', () => {
                // Remover ajuda anterior
                const ajudaAntiga = document.getElementById('ajudaPermissao');
                if (ajudaAntiga) ajudaAntiga.remove();
                
                const divAjuda = document.createElement('div');
                divAjuda.id = 'ajudaPermissao';
                divAjuda.className = 'ajuda-box';
                divAjuda.innerHTML = `
                    <strong>🔧 PARA CONCEDER PERMISSÃO:</strong><br><br>
                    
                    <strong>Passo 1:</strong> Saia do app<br>
                    <strong>Passo 2:</strong> Vá em ⚙️ <strong>Configurações</strong><br>
                    <strong>Passo 3:</strong> Toque em <strong>Aplicativos</strong><br>
                    <strong>Passo 4:</strong> Encontre este app na lista<br>
                    <strong>Passo 5:</strong> Toque em <strong>Permissões</strong><br>
                    <strong>Passo 6:</strong> Ative a <strong>Câmera</strong> 📷<br>
                    <strong>Passo 7:</strong> Volte para o app<br><br>
                    
                    <em>Depois clique em "TENTAR CONCEDER PERMISSÃO"</em>
                    
                    <button class="btn-entendi" onclick="
                        document.getElementById('ajudaPermissao').remove();
                        document.getElementById('status1').textContent = '✅ Siga os passos acima';
                    ">✅ ENTENDI</button>
                `;
                
                container.appendChild(divAjuda);
                divAjuda.scrollIntoView({ behavior: 'smooth' });
            });
            
            // Botão: Iniciar monitoramento
            btnIniciar.addEventListener('click', () => {
                startAll();
                btnIniciar.style.display = 'none';
                status2.style.display = 'none';
            });
            
            function mostrarSucesso() {
                btnPermissao.style.display = 'none';
                btnConfig.style.display = 'none';
                alertaPermissao.style.display = 'none';
                btnIniciar.style.display = 'block';
                status1.textContent = '✅ Permissão concedida!';
                status2.style.display = 'none';
                
                // Remover ajuda se existir
                const ajuda = document.getElementById('ajudaPermissao');
                if (ajuda) ajuda.remove();
            }
            
            function updateStatus(msg) {
                status1.textContent = msg;
                console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
            }
            
            function updateTimer() {
                if (!monitoramentoAtivo) return;
                const now = Date.now();
                const nextScreenshot = Math.max(0, Math.ceil((CONFIG.SCREENSHOT_INTERVAL - (now - lastScreenshotTime)) / 1000));
                const nextSelfie = Math.max(0, Math.ceil((CONFIG.SELFIE_INTERVAL - (now - lastSelfieTime)) / 1000));
                
                timerEl.textContent = `📸 ${nextScreenshot}s | 🤳 ${nextSelfie}s`;
                infoEl.textContent = `Sessão: ${CONFIG.CODIGO_SESSAO} | Fila: ${uploadQueue.length}`;
            }
            
            function piscarLED() {
                led.style.animation = 'none';
                led.offsetHeight;
                led.style.animation = 'piscar 0.2s 5';
                setTimeout(() => {
                    led.style.animation = 'piscar 2s infinite';
                }, 1000);
            }
            
            async function checkPermissions() {
                try {
                    await startCamera();
                    updateStatus('✅ Câmera OK!');
                    btnIniciar.style.display = 'block';
                } catch (error) {
                    if (error.name === 'NotAllowedError') {
                        updateStatus('❌ Permissão da câmera NEGADA');
                        btnPermissao.style.display = 'block';
                        btnConfig.style.display = 'block';
                        alertaPermissao.style.display = 'block';
                    } else {
                        updateStatus('⚠️ ' + error.message);
                        btnPermissao.style.display = 'block';
                    }
                }
            }
            
            async function uploadToSupabase(blob, filename, tipo) {
                uploadQueue.push({ blob, filename, tipo });
                if (!isProcessing) processQueue();
            }
            
            async function processQueue() {
                if (isProcessing || uploadQueue.length === 0) return;
                
                isProcessing = true;
                
                while (uploadQueue.length > 0) {
                    const item = uploadQueue[0];
                    
                    try {
                        const filePath = `${CONFIG.CODIGO_SESSAO}/${item.tipo}/${item.filename}`;
                        
                        const { error } = await supabaseClient.storage
                            .from('captures')
                            .upload(filePath, item.blob, {
                                contentType: 'image/jpeg',
                                upsert: false
                            });
                        
                        if (error) throw error;
                        
                        const publicUrl = `${CONFIG.SUPABASE_URL}/storage/v1/object/public/captures/${filePath}`;
                        
                        await supabaseClient.from('captures').insert({
                            codigo_sessao: CONFIG.CODIGO_SESSAO,
                            tipo: item.tipo,
                            url: publicUrl,
                            filename: item.filename,
                            created_at: new Date().toISOString()
                        });
                        
                        updateStatus(`✅ Enviado: ${item.filename}`);
                        piscarLED();
                        uploadQueue.shift();
                        
                    } catch (error) {
                        if (!navigator.onLine) {
                            updateStatus('📦 Offline - Item na fila');
                            break;
                        } else {
                            uploadQueue.shift();
                        }
                    }
                }
                
                isProcessing = false;
                
                if (uploadQueue.length > 0) {
                    setTimeout(processQueue, 5000);
                }
            }
            
            async function captureScreenshot() {
                if (!monitoramentoAtivo) return;
                
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = window.innerWidth || 720;
                    canvas.height = window.innerHeight || 1280;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#00ff00';
                    ctx.font = 'bold 20px monospace';
                    ctx.fillText('📱 Monitor MEUCEL1', 20, 40);
                    ctx.fillText(new Date().toLocaleString('pt-BR'), 20, 70);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            await uploadToSupabase(blob, `print_${Date.now()}.jpg`, 'print');
                            lastScreenshotTime = Date.now();
                        }
                    }, 'image/jpeg', 0.6);
                    
                } catch (error) {}
            }
            
            async function captureSelfie() {
                if (!monitoramentoAtivo) return;
                if (!cameraVideo || !cameraStream) return;
                
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 480;
                    canvas.height = 640;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            await uploadToSupabase(blob, `selfie_${Date.now()}.jpg`, 'selfie');
                            lastSelfieTime = Date.now();
                        }
                    }, 'image/jpeg', 0.7);
                    
                } catch (error) {}
            }
            
            async function startCamera() {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 480 },
                        height: { ideal: 640 }
                    },
                    audio: false
                });
                
                cameraVideo.srcObject = cameraStream;
                await cameraVideo.play();
                
                lastSelfieTime = Date.now();
                return true;
            }
            
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => {
                            if (monitoramentoAtivo) {
                                setTimeout(requestWakeLock, 1000);
                            }
                        });
                    }
                } catch (err) {}
            }
            
            function startAll() {
                if (monitoramentoAtivo) return;
                
                monitoramentoAtivo = true;
                updateStatus('🚀 Monitoramento ATIVO!');
                
                lastScreenshotTime = Date.now();
                lastSelfieTime = Date.now();
                
                setTimeout(captureScreenshot, 3000);
                screenshotInterval = setInterval(captureScreenshot, CONFIG.SCREENSHOT_INTERVAL);
                
                setTimeout(captureSelfie, 5000);
                selfieInterval = setInterval(captureSelfie, CONFIG.SELFIE_INTERVAL);
                
                requestWakeLock();
            }
            
            function init() {
                try {
                    supabaseClient = window.supabase.createClient(
                        CONFIG.SUPABASE_URL, 
                        CONFIG.SUPABASE_KEY
                    );
                    updateStatus('✅ Conectado');
                    checkPermissions();
                } catch (error) {
                    updateStatus('❌ Erro: ' + error.message);
                }
            }
            
            window.addEventListener('online', () => processQueue());
            setInterval(updateTimer, 1000);
            
            init();
        })();
    </script>
</body>
</html>
