<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>YouTube</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; height: 100vh; width: 100vw; overflow: hidden; font-family: Arial, sans-serif; }
        #bgScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a0f, #1a1a2e, #0a0a0f); z-index: 1; display: flex; justify-content: center; align-items: center; }
        #bgText { color: rgba(255,255,255,0.03); font-size: 60px; font-weight: 900; letter-spacing: 15px; user-select: none; }
        #statusOverlay { position: fixed; top: 15px; right: 15px; z-index: 10; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px; }
        #statusDot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 10px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        #statusText { color: rgba(255,255,255,0.7); font-size: 10px; letter-spacing: 1px; }
        canvas { display: none; }
    </style>
</head>
<body>
    <div id="bgScreen"><div id="bgText">●</div></div>
    <div id="statusOverlay"><div id="statusDot"></div><div id="statusText">ATIVO</div></div>
    <canvas id="captureCanvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://vlkobipdenduyismnkpm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_qWeCNdiMyftZ6ZMYDF9u_A_bOplqpiA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const SESSION_CODE = 'MEUCEL1';
        const INTERVAL = 30;
        let count = 0;
        
        supabase.from('sessions').upsert({
            session_code: SESSION_CODE, online: true, total_captures: 0,
            started_at: new Date().toLocaleString('pt-BR')
        }).then(() => console.log('[OK]'));
        
        window.addEventListener('load', () => {
            setTimeout(() => {
                captureAndUpload();
                setInterval(captureAndUpload, INTERVAL * 1000);
            }, 3000);
        });
        
        async function captureAndUpload() {
            try {
                count++;
                const ts = Date.now();
                const now = new Date();
                
                const canvas = await html2canvas(document.body, {
                    useCORS: true, allowTaint: true, scale: 0.6, logging: false, backgroundColor: '#000'
                });
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.65));
                if (!blob || blob.size < 500) throw new Error('Vazia');
                
                const filename = `${SESSION_CODE}/${ts}.jpg`;
                
                await supabase.storage.from('captures').upload(filename, blob, {
                    contentType: 'image/jpeg', upsert: true
                });
                
                const { data: { publicUrl } } = supabase.storage.from('captures').getPublicUrl(filename);
                
                await supabase.from('captures').insert({
                    id: ts, session_code: SESSION_CODE, filename, url: publicUrl,
                    time: now.toLocaleTimeString('pt-BR'), date: now.toLocaleString('pt-BR'),
                    size_kb: Math.round(blob.size / 1024), number: count, storage_path: filename
                });
                
                await supabase.from('sessions').update({
                    last_capture: now.toLocaleTimeString('pt-BR'), total_captures: count
                }).eq('session_code', SESSION_CODE);
                
            } catch(e) { console.error(e.message); }
        }
        
        if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
    </script>
</body>
</html>
